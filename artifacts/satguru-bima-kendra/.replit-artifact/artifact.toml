kind = "web"
previewPath = "/"
title = "Satguru Bima Kendra"
version = "1.0.0"
id = "artifacts/satguru-bima-kendra"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22466

[services.development]
run = "pnpm --filter @workspace/satguru-bima-kendra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/satguru-bima-kendra", "run", "build" ]
serve = "static"
publicDir = "artifacts/satguru-bima-kendra/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22466"
BASE_PATH = "/"
